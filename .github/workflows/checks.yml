name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web and bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.22.2
      - run: node --test web/tests/*.test.mjs
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s web/tests -p '*_test.py'

  rustsec:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install --locked --version 0.22.2 cargo-audit
      - run: cargo audit --deny warnings

  macos-build:
    name: macOS web-app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: zsh -n scripts/build-web-macos.sh
      - run: zsh scripts/build-web-macos.sh
