[package]
name = "amaraMusicVisualiser"
version = "0.6.25"
edition = "2024"
description = "A macOS-first, music-reactive GPU visualiser"
build = "build.rs"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.15"
directories = "6.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "persistence", "wgpu"] }
env_logger = "0.11"
log = "0.4"
png = "0.18.1"
pollster = "1.0.1"
rfd = "0.17.2"
rustfft = "6.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
